# specs/release-plan.yaml
# Purpose: Release index — lists every epic with WSJF priority order.
# What this file is: The sequence of work. Highest WSJF first.
#   Each epic maps to specs/epics/eNN-slug/ with stories and tasks.

target_version: "1.0.0"
last_release: null

epics:
