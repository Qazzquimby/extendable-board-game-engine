# specs/planning-context.yaml
# Written by elaborate-spec for the Spy decoy redesign epic.

feature_name: "Spy decoys as real objects"
problem_statement: >
  Spy decoys are currently implemented as SpyDecoyMarker(Marker) with a custom
  TargetSpyOrDecoys Aiming subclass. This is an unscalable pattern: the custom
  Aiming isn't recognized by choices.py's isinstance chain (was silently dropped,
  causing Spy to never attack), and every new hero needing targetable objects
  would require its own Aiming hack. Markers have no HP, no entity_at lookup,
  and can't be targeted by standard targeting systems.

constraints:
  - "Decoys must be targetable by standard TargetEntity logic"
  - "Decoys must move with Spy via ChangeLocationEvent"
  - "Decoys must die when Spy is revealed or takes damage"
  - "Decoys must have HP (1hp) so they can be destroyed"
  - "choices.py must have no special-case isinstance hacks for Spy"
  - "All existing Spy tests must pass after refactor"

out_of_scope:
  - "MCTS self-play pipeline"
  - "Spy balance or ability tuning"
  - "Other heroes' targeting systems"
  - "Spy Go Invisible priority improvements (separate bug BUG-004)"
  - "General ability priority refactor (separate bug BUG-002)"

key_decisions:
  - decision: "Decoys become SpyDecoyEntity(Entity) with 1hp, not Marker"
    rationale: "Entity subclasses appear in entity_at(), are targetable by TargetEntity, and can have HP/be destroyed"
  - decision: "Remove TargetSpyOrDecoys entirely"
    rationale: "No longer needed; standard TargetEntity with condition check replaces it"
  - decision: "Keep ChangeLocationEvent hook for decoy movement"
    rationale: "Decoys follow Spy, this mechanism works correctly"
  - decision: "Keep removal-on-damage mechanic from RevealOnHit modifier"
    rationale: "Works correctly — decoys die when Spy is hit"
