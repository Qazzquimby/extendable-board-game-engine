# specs/product/SCOPE_LATEST.yaml
# Scope for the Ability Priority Overhaul epic

core_value: >
  Every hero ability gets a situational priority value so the AI uses
  all tools available to it — not just the default attack.

summary: >
  Currently many abilities return 0 priority from _auto_priority because
  AddModifierInstruction.score returns 0, self-targeting buffs don't
  score, and tap abilities aren't evaluated separately. This scope adds
  general-purpose priority helpers to scoring.py, fixes the base score
  methods, and adds get_priority overrides to every hero ability.
  Verified via analyze_ability_usage.py.

in_scope:
  - "Fix AddModifierInstruction.score to return non-zero for all modifiers"
  - "Add general priority helpers to scoring.py (score_modifier, score_tap, score_ultimate)"
  - "Add get_priority to every ability without one"
  - "Fix Soldier 76 Helix Rockets, Biotic Field, Tactical Visor priorities"
  - "Fix Reinhardt Fire Strike, Earthshatter, Shield priorities"
  - "Fix Scout Bonk, Crit-a-Cola, Fan O'War priorities"
  - "Fix Zenyatta Orb of Harmony, Orb of Discord, Transcendence priorities"
  - "Fix Spy Go Invisible priority"
  - "Fix Necrophos Ghost Shroud priority"
  - "Verify all heroes use all abilities over 5 games"

out_of_scope:
  - "Game design balance changes (damage numbers, cooldowns)"
  - "New hero creation"
  - "Spy decoy redesign (already done)"
  - "Zenyatta post-death modifier cleanup (BUG-011)"

constraints:
  - "Every ability must have a get_priority method"
  - "Priority must reflect situation quality, not be a flat constant"
  - "Only return 0 priority if ability is genuinely useless in current situation"

success_criteria:
  - "analyze_ability_usage.py HeroName --games 5 shows all abilities used at least once"
  - "Default attack is used most often (highest priority in combat)"
  - "Ultimates are used when available"
  - "Defensive abilities used when threatened"
  - "Healing abilities used when damaged"
