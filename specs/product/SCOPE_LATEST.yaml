# specs/product/SCOPE_LATEST.yaml
# Scope for the Spy Decoy Object Redesign epic.

core_value: >
  Replace the fragile custom-aiming hack for Spy decoys with proper Entity
  objects, making the decoy system scalable, testable, and compatible with
  the standard targeting pipeline.

summary: >
  Spy decoys are currently SpyDecoyMarker(Marker) objects targeted via a
  custom TargetSpyOrDecoys Aiming subclass. This pattern is unscalable:
  the custom Aiming was silently dropped by choices.py's isinstance chain,
  causing Spy to never attack. Every new hero needing targetable objects
  would require its own Aiming hack. This scope replaces Marker-based
  decoys with SpyDecoyEntity(Entity) subclasses that have 1 HP, appear in
  entity_at() lookups, and are targetable via standard TargetEntity.
  The custom TargetSpyOrDecoys class and the isinstance hack in choices.py
  are removed.

in_scope:
  - "Create SpyDecoyEntity(Entity) subclass with 1 HP"
  - "Decoys move with Spy via ChangeLocationEvent hook (existing mechanism)"
  - "Decoys die when Spy is revealed or takes damage (existing mechanic)"
  - "Revolver targets decoys AND enemies via TargetEntity(in_range=4, condition=is_enemy_or_decoy)"
  - "Knife targets decoys AND enemies via TargetEntity(in_range=1, condition=is_enemy_or_decoy)"
  - "Remove TargetSpyOrDecoys custom Aiming class"
  - "Remove isinstance(ability.aiming, TargetSpyOrDecoys) hack from choices.py"
  - "Update existing Spy tests to work with new Entity-based decoys"
  - "Verify AI uses Revolver and Knife via analyze_ability_usage.py"

out_of_scope:
  - "General ability priority improvements (BUG-002) — deferred to separate work"
  - "Spy Go Invisible priority fix (BUG-004) — deferred"
  - "Other heroes' ability priority fixes (BUG-007, BUG-008, BUG-009) — deferred"
  - "Movement AI optimal range (BUG-010) — deferred"
  - "Zenyatta post-death damage fix (BUG-011) — deferred"
  - "Necrophos Ghost Shroud timing fix (BUG-012) — deferred"
  - "MCTS self-play pipeline"
  - "Spy balance or ability tuning"

constraints:
  - "All existing Spy tests must still pass after refactor"
  - "No custom Aiming subclasses for Spy targeting"
  - "choices.py must not contain isinstance hacks for Spy"
  - "Decoys must be destroyable (1 HP)"
  - "Decoys must move with Spy automatically"

success_criteria:
  - "SpyDecoyEntity replaces SpyDecoyMarker — decoys are full Entity objects"
  - "TargetSpyOrDecoys class is removed from codebase"
  - "isinstance hack for Spy in choices.py is removed"
  - "Spy uses Revolver and Knife in AI games (verify via analyze_ability_usage.py)"
  - "All Spy tests pass"
  - "All 143 existing tests pass"

references:
  - "BUG-001: specs/bugs/BUG-001-spy-decoys-objects.md"
  - "CONVENTIONS.md: Hero & Ability Standards"
