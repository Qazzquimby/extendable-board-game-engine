name: Dota 2
completion: BETA
color: [ .67, .18, .08 ]
description: |-
  - STATUS: WIP maps. Heroes are fine and could play with maps from other games.
  - Ultimates
heroes:
  - name: Axe
    complexity: 1
    description: |-
      - Provoke and counterattack
      - Reflect damage back to attackers
    image_url: https://cdn.cloudflare.steamstatic.com/apps/dota2/videos/dota_react/heroes/renders/axe.png
    health: 10
    speed: 3
    passives:
      - name: Receive damage
        text: |-
          Enemies in burst 1, 1dmg
      - name: Receive damage from a Default Ability
        text: The attacker takes 1/2 the damage received, before Armor.
    default_abilities:
      - name: Axe
        text: |-
          Range 1, 2dmg
    abilities:
      - name: Berserker's Call
        text: |-
          1/Game, Free Action
          Until the beginning of your next turn,
            You have Armor
            When an enemy starts their turn in range 1 of you,
              they cannot move, and they must use a default attack targeting you, if possible, spending actions as normal.
        hints:
          - REFERENCE_ArmorHint
      - name: Battle Hunger
        text: |-
          1/Game:
          Range 3, give the 2 DoT and a Battle Hunger token:
            Moving away from you costs twice as many spaces. When they kill a unit, they lose the token and clear all DoT.
        tokens:
          - REFERENCE_DoT
          - name: Battle Hunger
            image_url: https://static.wikia.nocookie.net/dota2_gamepedia/images/0/00/Battle_Hunger_icon.png/revision/latest?cb=20121003222330
            text: |-
              Moving away from Axe costs you twice as many spaces.
              When you kill a unit, lose this and clear all DoT.
      - name: Culling Blade
        text: |-
          1/Game
          Range 1, 3dmg irreducible
          On kill:
            The target does not trigger any on-death reactions.
            Refresh this.
            If the kill was a hero, for the rest of the game you have Armor.
        tokens:
          - REFERENCE_Armor
    bot_cards:
      passives:
        - name: Receive damage
          text: |-
            Enemies in burst 1, 1dmg
        - name: Receive damage from a Default Ability
          text: The attacker takes 1/2 the damage received, before Armor.
      default:
        text: |-
          Move 3 to nearest enemy
          
          Attack Range 1, 2dmg. +1 and irreducible if target has <=3 health. Target doesn't trigger on-death reactions.
          Else Move 3 to nearest enemy
      abilities:
        - name: Default
          text: ''
          count: 3
        - name: Battle Hunger
          text: |-
            Move 3 to nearest enemy
            
            Attack Range 3, give the 2 DoT and a Battle Hunger token, !Remove this!.
              Moving away from you costs twice as many spaces. When they kill a unit, they lose the token and clear all DoT.
            Else Move 3 to nearest enemy
        - name: Berserker's Call
          text: |-
            Do a default action.
            If there is an enemy at range 1:
              Remove this
              Until the beginning of your next turn,
                You have Armor
                When an enemy starts their turn in range 1 of you,
                  they cannot move, and they must use a default attack targeting you, if possible, spending actions as normal.

  - name: Crystal Maiden
    complexity: 3
    polish: [ needs_testing ]
    description: |-
      - Slow and nuke enemies
      - Allies have an extra n/Game use.
      - Awful speed and health
    image_url: https://cdn.cloudflare.steamstatic.com/apps/dota2/videos/dota_react/heroes/renders/crystal_maiden.png
    health: 6
    speed: 2
    passives:
      - name: Deploy
        text: |-
          You and all allies can put an extra charge on a n/game ability.
      - name: Chilled
        text: |-
          Slowed enemies deal -1 damage.
    tokens:
      - name: Extra Ability Use
        image_url: https://static.wikia.nocookie.net/dota2_gamepedia/images/5/5a/Arcane_Aura_icon.png/revision/latest?cb=20111005085505
        text: |-
          Gain an extra 1/Game use of this ability. (Ultimates are 1/Game)
    default_abilities:
      - name: Ice Bolt
        text: Range 4, 2dmg
    abilities:
      - name: Crystal Nova
        text: |-
          Tap:
          Range 3 2x2, 3dmg, Slow
        tokens:
          - REFERENCE_Slow
      - name: Frostbite
        text: |-
          Tap:
          Range 3, 2dmg, give **immobile and disarm
        tokens:
          - REFERENCE_Immobile
          - REFERENCE_Disarm
      - name: Crystal Clone
        text: |-
          1/Game, Free Action
          Move 2, and create a Crystal Clone marker in your previous space.
          Crystal Clone marker has 1 hp and can be targeted like a unit.
          At the beginning of your turn, destroy Crystal Clone.
          
          When Crystal Clone is destroyed, it deals burst 1, 2dmg immobilize and disarm.
        tokens:
          - name: Crystal Clone
            image_url: https://static.wikia.nocookie.net/dota2_gamepedia/images/a/a1/Crystal_Clone_icon.png/revision/latest/scale-to-width-down/128?cb=20230809011951
            is_marker: true
            text: |-
              When destroyed, it deals burst 1, 2dmg immobilize and disarm.
          - REFERENCE_Immobile
          - REFERENCE_Disarm
      - name: Freezing Field
        text: |-
          Ultimate 4, Free Action
          Enemies in burst 3 ignoring walls, slow.
          Enter freezing field stance:
            At the start of your turn, you may spend Move+Standard Actions for
              Enemies in burst 3 ignoring walls, 4dmg, slow.
            If you don't, end this effect.
        tokens:
          - name: Freezing Field Stance
            image_url: https://static.wikia.nocookie.net/dota2_gamepedia/images/d/de/Freezing_Field_icon.png/revision/latest/scale-to-width-down/128?cb=20111005085503
          - REFERENCE_Slow
        hints:
          - REFERENCE_UltimateHint
    bot_cards:
      passives:
        - name: Deploy
          text: |-
            Each ally returns the first card they would remove from their deck
        - name: Chilled
          text: |-
            Slowed enemies deal -1 damage.
      default:
        text: |-
          Move 2 to range 4 of nearest enemy
          
          Attack Range 4, 2dmg
          Else move 2 behind nearest ally
      abilities:
        - name: Default
          text: ''
          count: 3
        - name: Crystal Nova
          text: |-
            Move 2 to range 3 of nearest enemy
            
            Range 3 2x2, 3dmg, Slow
            Else move 2 behind nearest ally
        - name: Frostbite
          text: |-
            Move 2 to range 3 of nearest enemy
            
            Range 3, 2dmg, immobilize and disarm
            Else move 2 behind nearest ally
        - name: Crystal Clone
          text: |-
            Use another action card, then
            !Remove This!
            Move 2 away from the nearest enemy, and create a Crystal Clone marker in your previous space.
            Crystal Clone marker has 1 hp and can be targeted like a unit.
            At the beginning of your turn, destroy Crystal Clone.

            When Crystal Clone is destroyed, it deals burst 1, 2dmg immobilize and disarm.
        - name: Freezing Field
          text: |-
            If turn is 1-3, redraw and shuffle this into the deck
            
            !Remove this!
            Move 2 towards the nearest enemy
            Enemies in burst 3 ignoring walls, slow.
            Enter freezing field stance:
              At the start of your turn, you may spend Move+Standard Actions for
                Enemies in burst 3 ignoring walls, 4dmg, slow.
              If you don't, end this effect.
