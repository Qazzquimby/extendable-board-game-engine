- name: Reinhardt
  complexity: 3
  description: |-
    Melee cleave tank with a sight-line shield and a rhino charge nuke. Late game area stun.
  health: 12
  speed: 3
  art: hero.jpg
  passives:
    - name: Cannot be pushed or pulled.
      text: ""
    - name: You are *undefendable*.
      text: ""
  hints:
    - REFERENCE_UndefendableHint
  default_abilities:
    - name: Rocket Hammer
      text: |-
        ✺3 adjacent spaces in burst 1: 2dmg.
  abilities:
    - name: Barrier Field
      art: barrier.jpg
      text: |-
        *Instant* +3:
        Enter shield stance:
          You have facing and can freely set your facing at the end of your turn.
          You are *slow* -2.
          You can't take standard actions.
        
          There is a 3 space long Barrier *object* on the edge in front of you, centered on your position, which moves with you.
          The barrier blocks line of sight for your enemies.
          The barrier has 10hp and cannot be healed.
        You can dismiss the stance as a Free Action if you have ended an activation with it active.

#          TODO should have an illustration?
      hints:
        - REFERENCE_SlowHint
        - REFERENCE_InstantHint
        - REFERENCE_FacingHint
        - REFERENCE_ObjectHint
      dice:
        - name: Barrier health
          color: red
          values: [ 6, 4 ]
      Barrier: &Barrier
        name: Barrier Field
        art: barrier.jpg
        is_marker: true
        size: 0.5
        text: This edge is part of the barrier.
      tokens:
        - *Barrier
        - *Barrier
        - *Barrier
    - name: Charge
      text: |-
        1/game, Move + Standard Action:
        Move as far as possible in a line.
        When you would move into an enemy unit this way: ⌖Roll attack with +3 *miss*.
        The first enemy hit this way: Push them with you as far as possible. 6dmg. Give *immobile*.
        ✺Other enemies in the line: 1dmg. Push 1 away from the line.
      tokens:
        - REFERENCE_Immobile
    - name: Fire Strike
      text: |-
        *Tap*:
        ✺Unlimited line: 3dmg.
      hints:
        - REFERENCE_TapHint
    - name: Earthshatter
      text: |-
        *Ultimate* 4:
        ✺3x3 centered on range 2: Units in the area can move 1 and get **Immobile**. Units still in the area get **Full Stun**.
      conditions:
        - REFERENCE_Immobile
        - REFERENCE_FullStun
      hints:
        - REFERENCE_UltimateHint

