          When this would be damaged or destroyed, reveal if. If "real", replace this with creator, else destroy this.
          At any time, creator may reveal and destroy all their **Possible Location** markers to place themself at the "real" marker.
          As a Move Action, creator can remove any number of their **Possible Location** markers to place them within in range 3 of any of the markers that were not placed this turn.
      tokens:
