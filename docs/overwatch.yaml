name: Overwatch
color: [ .94, .592, .114 ]
description: |-
  - Many once per game affects, and ultimate abilities that are only playable late game.
  - Many instant speed defensive reactions.
  - Clear tank and healer roles.

#    rules:
#      - REFERENCE_RuleInstant
#      - REFERENCE_RuleUltimate
#      - REFERENCE_RuleFlying
#      - REFERENCE_RuleFacing
#      - REFERENCE_RuleCriticalMoment
heroes:
  - name: Widowmaker
    complexity: 2
    description: |-
      A charge-up sniper who quickly locks down a sightline.
    health: 8
    speed: 3
    art: widowmaker/hero.jpg
    default_abilities:
      - name: Widow's Kiss SMG
        text: |-
          ⌖Range 2: 2dmg.
      - name: Widow's Kiss Scoped
        text: |-
          Set your facing and gain **Charged**.
    passives:
      - name: Scoped in
        text: |-
          At the start of your turn, lose **Charged**. If you did:
            ⌖Range 2+ in front: *undefendable*, +2 *crit*, 6dmg.
    hints:
      - REFERENCE_FacingHint
      - REFERENCE_UndefendableHint
      - REFERENCE_CritHint
    tokens:
      - REFERENCE_Charged
    abilities:
      - name: Create Venom Mine
        art: venom_mine.jpg
        text: |-
          1/game:
          Create a **Venom Mine** object in an emtpy space in range 3.
          It has:
            1hp.
            When an enemy enters burst 1 of this, destroy this.
            When destroyed: ✺Burst 1: Give **Damage Over Time**.
        tokens:
          - name: Venom Mine
            art: venom_mine.jpg
            is_marker: true
            text: |-
              1hp.
              When an enemy enters ✺burst 1 of this, destroy this.
              When destroyed: ✺Burst 1: Give **Damage Over Time**.
        conditions:
          - REFERENCE_DamageOverTime
      - name: Grappling Hook
        text: |-
          1/game, Move Action:
          *Fly* to an empty space in range 5 along a shortest path.
        hints:
          - REFERENCE_FlyingHint
      - name: Infra-Sight
        text: |-
          *Ultimate* 4, Free Action:
          Gain passive:
            Enemies are *undefendable*.
            Enemies cannot be *untargetable*.
            All allies have +2 *crit*.
        hints:
          - REFERENCE_UltimateHint
          - REFERENCE_UndefendableHint
          - REFERENCE_UntargetableHint
  - name: Tracer
    complexity: 3
    description: |-
      Hypermobile dodging assassin.
    health: 6
    speed: 4
    art: hero.jpg
    default_abilities:
      - name: Pulse Pistols
        text: |-
          ⌖Range 1: 4dmg.
    passives:
      - name: On Deployment
        text: Place your **Recall Location** marker in your space.
    tokens:
      - name: Recall location reminder
        art: _recall.jpg
        is_marker: true
    abilities:
      - name: Blink
        text: |-
          3/game, *instant* +2:
          Teleport to an empty space in range 3.
        dice:
          - name: Uses Remaining
            color: white
            values: [ 3 ]
        hints:
          - REFERENCE_InstantHint
      - name: Recall
        art: recall.jpg
        text: |-          
          1/game, *instant* +3:
          Set your health to full.
          Teleport to a space nearest to your **Recall Location** marker.
        hints:
          - REFERENCE_InstantHint
      - name: Create Pulse Bomb
        art: pulse_bomb.jpg
        text: |-
          *Ultimate* 5:
          Space in range 1:
            If there's a unit in the space, ⌖attack them with +2 *miss*.
            On hit, give them **Pulse Bomb**.
            On miss, create **Pulse Bomb** in that space.
          
          Pulse Bomb has:
            At the start of the creator's activation:
            ✺This space: 6dmg.
            ✺Burst 1: 3dmg.
            Destroy this.
        tokens:
          - name: Pulse Bomb
            art: pulse_bomb.jpg
            is_marker: true
            text: |-
              At the start of creator's activation:
              ✺This space: 6dmg.
              ✺Burst 1: 3dmg.
              Destroy this.
        hints:
          - REFERENCE_UltimateHint
  - name: Mercy
    complexity: 2
    description: |-
      Support with a strong heal, damage buff, and resurrection.
    health: 8
    speed: 3
    art: hero.jpg
    passives:
      - name: Start of activation
        text: If you did not take damage since the start of your last activation, heal yourself 3.
      - name: Ally hero dies
        text: |-
          Place a **Corpse** marker in their space and note which ally it corresponds to.
    conditions:
      - name: Caduceus Staff Damage Boost
        art: staff.jpg
        is_positive: true
        text: Until end of activation, deal +50% damage.
    tokens:
      - name: Took damage since start of last activation reminder
        art: no_took_damage.png
        back_art: took_damage.png
        artist: game-icons.net
        text: Flip this face down when you take damage, and face up at the start of your activation.
      - REFERENCE_Corpse
    default_abilities:
      - name: Caduceus Staff (Heal)
        text: |-
          ⌖Range 3: *undefendable*, heal target 4.
      - name: Caduceus Staff (Give Damage Boost)
        text: |-
          ⌖Range 3: *undefendable* give **Caduceus Staff Damage Boost**.
          It has:
            Until end of activation, deal +50% damage.
      - name: Caduceus Blaster
        text: |-
          ⌖Range 3: 2dmg.
    hints:
      - REFERENCE_UndefendableHint
    abilities:
      - name: Guardian Angel
        text: |-
          *Fly* to an empty space in burst 1 of an ally or **corpse** marker along a shortest path.
        hints:
          - REFERENCE_FlyingHint
      - name: Resurrect
        text: |-
          1/game, Free Action:
          At the start of your next activation:
            ⌖**Corpse** in range 1:
            You may replace the **corpse** with its corresponding unit at full health in that space.
        tokens:
          - REFERENCE_Charged
      - name: Valkyrie
        text: |-
          *Ultimate* 4, Free Action:
          Gain Passive:
            At the start of each your activation: Heal yourself 2.
            Your **Caduceus Staff** abilities have "⌖Range 5, and optionally ⌖another target in range 2 of first".
            You can use **Guardian Angel** as a Move Action.
            You are always *flying*.
        hints:
          - REFERENCE_FlyingHint
          - REFERENCE_UltimateHint
  - name: Pharah
    complexity: 3
    description: |-
      High flying rocket launcher.
    health: 8
    speed: 4
    art: hero.jpg
    passives:
      - name: You are always Flying
        text: ""
    hints:
      - REFERENCE_FlyingHint
    default_abilities:
      - name: Rocket Launcher
        text: |-
          ⌖Unlimited range: +3 *miss* if range 4+. 2dmg.
          ✺Burst 1 of target: 1dmg.
    abilities:
      - name: Deplete Hover Jets
        text: |-
          *Tap*, Move Action:
          Move 2. Gain **High Up**.
        conditions:
          - REFERENCE_HighUp
        hints:
          - REFERENCE_HighUpHint
      - name: Jump Jet
        text: |-
          1/game, *instant* +2:
          Move 2. Gain **High Up** until the start of your next activation.
        tokens:
          - REFERENCE_HighUp
        hints:
          - REFERENCE_InstantHint
          - REFERENCE_TapHint
          - REFERENCE_HighUpHint
      - name: Concussive Blast
        text: |-
          Target space in range 4.
          Units in burst 1 of the space but outside it: Push 1 away from the space.
          Unit in the space: Push 2 in any direction.
      - name: Barrage
        text: |-
          *Ultimate* 5, Move + Standard Action:
          ✺2x2 in range 2: 4dmg.
        hints:
          - REFERENCE_UltimateHint
  - name: Reaper
    complexity: 1
    description: |-
      Close range, self healing tank buster.
    health: 8
    speed: 3
    art: hero.webp
    passives:
      - name: The Reaping
        text: |-
          When you deal damage, heal yourself 1/2 the amount.
      - name: Soul Reaving
